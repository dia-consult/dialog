<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dialog — Вхід</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 18% 12%, #213654, transparent 38%), #07111f; color: #f8faff; }
      main { width: min(500px, calc(100% - 40px)); border: 1px solid #30435f; border-radius: 30px; background: #14243d; padding: 48px; box-shadow: 0 28px 80px #0009; }
      .brand { font-weight: 800; font-size: 24px; letter-spacing: -.05em; } .brand i { color: #b7ff18; font-style: normal; }
      .eyebrow { margin-top: 44px; color: #b7ff18; font-size: 12px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(32px, 7vw, 47px); line-height: 1; letter-spacing: -.06em; }
      p { color: #afbdd1; line-height: 1.6; margin: 0 0 30px; }
      label { display: block; margin-bottom: 10px; font-weight: 700; color: #e5ebf5; }
      input, button { font: inherit; } input { width: 100%; padding: 17px 18px; border: 1px solid #536884; border-radius: 16px; background: #edf3ff; color: #101827; font-size: 18px; outline: none; }
      input:focus { box-shadow: 0 0 0 3px #b7ff1855; }
      button { width: 100%; margin-top: 18px; border: 0; border-radius: 16px; padding: 18px; background: #b7ff18; color: #08111e; cursor: pointer; font-weight: 800; font-size: 18px; box-shadow: 0 13px 30px #a8f90a36; }
      button:disabled { opacity: .65; cursor: wait; } #status { min-height: 24px; margin: 18px 0 0; color: #b9c8dd; } #status.error { color: #ffaaa5; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><i>dia</i>log</div>
      <div class="eyebrow">Робочий простір</div>
      <h1>Увійдіть у Dialog</h1>
      <p>Надішлемо одноразове безпечне посилання на ваш робочий email.</p>
      <form id="form">
        <label for="email">Робочий email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@company.com" />
        <button id="submit" type="submit">Продовжити з email&nbsp; →</button>
      </form>
      <div id="status" aria-live="polite"></div>
    </main>
    <script>
      const form = document.getElementById('form');
      const email = document.getElementById('email');
      const submit = document.getElementById('submit');
      const status = document.getElementById('status');
      form.addEventListener('submit', async (event) => {
        event.preventDefault(); status.className = ''; status.textContent = ''; submit.disabled = true;
        try {
          const response = await fetch('/api/auth/magic-link', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email.value }) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Не вдалося надіслати посилання');
          status.textContent = 'Перевірте пошту — посилання для входу вже надіслано.';
        } catch (error) { status.textContent = error.message; status.className = 'error'; }
        finally { submit.disabled = false; }
      });
    </script>
  </body>
</html>
