<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#172337"/><stop offset="1" stop-color="#0b121e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#000" flood-opacity=".32"/></filter>
    <style>.f{font-family:Manrope,Inter,'Helvetica Neue',Arial,sans-serif}.w{fill:#f7f8fb}.m{fill:#95a2b5}.lime{fill:#bafb28}.line{fill:none;stroke:#bafb28;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#bafb28;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#1d2a3d;stroke:#34445c;stroke-width:1}</style>
  </defs>
  <rect width="1440" height="900" fill="#d9dbe0"/>
  <rect x="42" y="38" width="1356" height="824" rx="48" fill="url(#bg)" filter="url(#shadow)"/>
  <text x="100" y="120" class="f w" font-size="34" font-weight="600" letter-spacing="-1">Направления знака для dialog</text>
  <text x="102" y="154" class="f m" font-size="16">Все варианты связывают «диалог» с разговором, смыслом и действием.</text>
  <g filter="url(#shadow)">
    <rect x="96" y="207" width="394" height="270" rx="27" class="card"/><rect x="523" y="207" width="394" height="270" rx="27" class="card"/><rect x="950" y="207" width="394" height="270" rx="27" class="card"/>
    <rect x="96" y="513" width="394" height="270" rx="27" class="card"/><rect x="523" y="513" width="394" height="270" rx="27" class="card"/><rect x="950" y="513" width="394" height="270" rx="27" class="card"/>
  </g>
  <!-- 1: current insight spark -->
  <path d="M153 253c4 19 14 29 32 33-18 4-28 14-32 33-4-19-14-29-33-33 19-4 29-14 33-33Z" class="lime"/>
  <text x="205" y="306" class="f w" font-size="38" font-weight="700" letter-spacing="-2.6"><tspan fill="#bafb28">dia</tspan>log</text>
  <text x="126" y="382" class="f w" font-size="16" font-weight="650">1. Инсайт</text><text x="126" y="410" class="f m" font-size="13">AI нашёл важный момент в разговоре.</text>
  <!-- 2: bubble with insight -->
  <path d="M125 261h51a16 16 0 0 1 16 16v29a16 16 0 0 1-16 16h-26l-19 15 3-15h-9a16 16 0 0 1-16-16v-29a16 16 0 0 1 16-16Z" class="line"/>
  <circle cx="143" cy="292" r="3" class="lime"/><circle cx="159" cy="292" r="3" class="lime"/><circle cx="175" cy="292" r="3" class="lime"/>
  <path d="M183 246c2 8 6 12 14 14-8 2-12 6-14 14-2-8-6-12-14-14 8-2 12-6 14-14Z" class="lime"/>
  <text x="222" y="306" class="f w" font-size="38" font-weight="700" letter-spacing="-2.6"><tspan fill="#bafb28">dia</tspan>log</text>
  <text x="553" y="382" class="f w" font-size="16" font-weight="650">2. Диалог + AI</text><text x="553" y="410" class="f m" font-size="13">Разговор, из которого извлекается смысл.</text>
  <!-- 3: sound wave -->
  <path d="M126 304v-14m15 25v-36m15 47v-58m15 47v-36m15 25v-14" class="line"/>
  <circle cx="156" cy="297" r="43" class="thin" opacity=".65"/>
  <text x="225" y="306" class="f w" font-size="38" font-weight="700" letter-spacing="-2.6"><tspan fill="#bafb28">dia</tspan>log</text>
  <text x="980" y="382" class="f w" font-size="16" font-weight="650">3. Голос</text><text x="980" y="410" class="f m" font-size="13">Звонок, транскрипт и живой голос клиента.</text>
  <!-- 4: two speech bubbles -->
  <path d="M119 267h48a14 14 0 0 1 14 14v23a14 14 0 0 1-14 14h-22l-17 14 3-14h-12a14 14 0 0 1-14-14v-23a14 14 0 0 1 14-14Z" class="line"/>
  <path d="M170 286h38a13 13 0 0 1 13 13v20a13 13 0 0 1-13 13h-16l-15 12 3-12h-10" class="thin" opacity=".8"/>
  <text x="242" y="306" class="f w" font-size="38" font-weight="700" letter-spacing="-2.6"><tspan fill="#bafb28">dia</tspan>log</text>
  <text x="126" y="688" class="f w" font-size="16" font-weight="650">4. Два голоса</text><text x="126" y="716" class="f m" font-size="13">Менеджер и клиент: связь двух сторон.</text>
  <!-- 5: focused signal -->
  <circle cx="155" cy="294" r="34" class="thin"/><circle cx="155" cy="294" r="20" class="thin" opacity=".78"/><circle cx="155" cy="294" r="6" class="lime"/><path d="M189 260l21-21" class="line"/><path d="M201 239h10v10" class="line"/>
  <text x="237" y="306" class="f w" font-size="38" font-weight="700" letter-spacing="-2.6"><tspan fill="#bafb28">dia</tspan>log</text>
  <text x="553" y="688" class="f w" font-size="16" font-weight="650">5. Фокус</text><text x="553" y="716" class="f m" font-size="13">Находим точку роста в каждом диалоге.</text>
  <!-- 6: upward conversation -->
  <path d="M115 318v-49a15 15 0 0 1 15-15h46a15 15 0 0 1 15 15v24a15 15 0 0 1-15 15h-29l-20 16 3-16h-15Z" class="line"/>
  <path d="M145 292l12-12 10 8 24-24" class="line"/><path d="M182 264h9v9" class="line"/>
  <text x="223" y="306" class="f w" font-size="38" font-weight="700" letter-spacing="-2.6"><tspan fill="#bafb28">dia</tspan>log</text>
  <text x="980" y="688" class="f w" font-size="16" font-weight="650">6. Рост через диалог</text><text x="980" y="716" class="f m" font-size="13">Каждый разговор ведёт к улучшению продаж.</text>
</svg>
