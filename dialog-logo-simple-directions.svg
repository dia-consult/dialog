<path d="M140 593c0-32 25-56 57-56h22c32 0 57 24 57 56s-25 56-57 56h-22" class="line"/><path d="M219 593c0-32 25-56 57-56h22c32 0 57 24 57 56s-25 56-57 56h-22" class="line" opacity=".48"/><text x="365" y="608" class="f w" font-size="40" font-weight="700" letter-spacing="-2">dialog</text><text x="105" y="654" class="f w" font-size="18" font-weight="700">C. Связь</text><text x="105" y="678" class="f m" font-size="14">Две стороны разговора соединены одним жестом.</text>
