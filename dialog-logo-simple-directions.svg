<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><style>.f{font-family:Arial,sans-serif}.lime{fill:#bafb28}.w{fill:#f7f8fb}.m{fill:#8e9caf}.card{fill:#121d2d;stroke:#31425a;stroke-width:2}.line{fill:none;stroke:#bafb28;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1200" height="760" fill="#09111d"/><text x="70" y="76" class="f w" font-size="35" font-weight="700">Простые направления для dialog</text><text x="71" y="110" class="f m" font-size="17">Один знак. Одна форма. Узнаваемость без объяснения.</text>
