<!-- A: open D -->
<path d="M168 225v99M168 225h30c38 0 63 20 63 50s-25 50-63 50h-30" class="line"/><circle cx="168" cy="274" r="10" class="lime"/><text x="302" y="290" class="f w" font-size="40" font-weight="700" letter-spacing="-2">dialog</text><text x="105" y="363" class="f w" font-size="18" font-weight="700">A. Открытая D</text><text x="105" y="388" class="f m" font-size="14">Форма буквы D — открыта для диалога.</text>
