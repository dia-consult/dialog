<path d="M713 222c5 25 18 38 43 43-25 5-38 18-43 43-5-25-18-38-43-43 25-5 38-18 43-43Z" class="lime"/><path d="M755 238c2 11 8 17 19 19-11 2-17 8-19 19-2-11-8-17-19-19 11-2 17-8 19-19Z" class="w" opacity=".16"/><text x="812" y="290" class="f w" font-size="40" font-weight="700" letter-spacing="-2">dialog</text><text x="655" y="363" class="f w" font-size="18" font-weight="700">B. Знак-инсайт</text><text x="655" y="388" class="f m" font-size="14">Уникальная форма вместо буквальной иконки.</text>
