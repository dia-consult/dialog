  <rect x="310" y="788" width="62" height="38" rx="12" fill="#fff7e9"/><text x="322" y="814" class="amber" font-size="17" font-weight="700">41%</text><text x="396" y="804" class="t label">Клиент Z</text><text x="396" y="825" class="muted small">Звонок · 8 мин · вчера, 17:26</text><text x="760" y="811" class="amber label">Упущен cross-sell</text>
