<rect width="1200" height="1180" fill="#09121f"/><text x="70" y="78" class="f w" font-size="35" font-weight="700">«Два голоса» — шесть вариаций</text><text x="71" y="111" class="f m" font-size="17">Один знак для менеджера и клиента: разговор, связь и понимание.</text>
<rect x="70" y="158" width="510" height="280" rx="28" class="card"/><rect x="620" y="158" width="510" height="280" rx="28" class="card"/><rect x="70" y="480" width="510" height="280" rx="28" class="card"/><rect x="620" y="480" width="510" height="280" rx="28" class="card"/><rect x="70" y="802" width="510" height="280" rx="28" class="card"/><rect x="620" y="802" width="510" height="280" rx="28" class="card"/>
<!-- 1 classic overlap -->
