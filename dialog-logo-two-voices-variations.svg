<path d="M117 553h120a38 38 0 0 1 38 38v43a38 38 0 0 1-38 38h-60l-44 34 7-34h-23a38 38 0 0 1-38-38v-43a38 38 0 0 1 38-38Z" class="l lime"/><path d="M257 588h63a32 32 0 0 1 32 32v37a32 32 0 0 1-32 32h-30l-36 28 6-28" class="l olive"/><text x="389" y="632" class="f w" font-size="32" font-weight="700" letter-spacing="-2">dialog</text><text x="654" y="727" class="f w" font-size="17" font-weight="700">4. Мягкая пара</text><text x="654" y="750" class="f m" font-size="14">Более дружелюбная и спокойная форма.</text>
