<path d="M118 549h119a34 34 0 0 1 34 34v47a34 34 0 0 1-34 34h-53l-43 34 6-34h-29a34 34 0 0 1-34-34v-47a34 34 0 0 1 34-34Z" class="l lime"/><path d="M245 579h78a34 34 0 0 1 34 34v45a34 34 0 0 1-34 34h-32l-39 31 6-31" class="l olive"/><path d="M242 583h19" class="l lime"/><text x="389" y="632" class="f w" font-size="32" font-weight="700" letter-spacing="-2">dialog</text><text x="104" y="727" class="f w" font-size="17" font-weight="700">3. Связка</text><text x="104" y="750" class="f m" font-size="14">Реплики соединены одной линией.</text>
