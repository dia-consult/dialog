<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dialog — Вхід</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #f6f8fc; }
      main { width: min(440px, calc(100% - 48px)); padding: 40px; border: 1px solid #2b3b54; border-radius: 28px; background: #14233a; box-shadow: 0 24px 70px #0008; }
      .mark { color: #b8ff17; font-weight: 800; letter-spacing: .04em; font-size: 14px; text-transform: uppercase; }
      h1 { margin: 14px 0 10px; font-size: 30px; } p { margin: 0; color: #b5c0d2; line-height: 1.55; }
      .loader { width: 28px; height: 28px; margin-top: 28px; border: 3px solid #344561; border-top-color: #b8ff17; border-radius: 50%; animation: spin .8s linear infinite; }
      .error { color: #ff9b93; } a { color: #b8ff17; font-weight: 700; } @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">Dialog</div>
      <h1 id="title">Підтверджуємо вхід</h1>
      <p id="message">Будь ласка, зачекайте кілька секунд.</p>
      <div class="loader" id="loader"></div>
    </main>
    <script>
      (async () => {
        const params = new URLSearchParams(location.search);
        const token = params.get('discovery_magic_links_token') || params.get('token');
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const loader = document.getElementById('loader');
        if (!token) {
          title.textContent = 'Посилання неповне';
          message.innerHTML = 'Спробуйте надіслати новий лист на <a href="/login">сторінці входу</a>.';
          loader.remove();
          return;
        }
        try {
          const response = await fetch('/api/auth/discovery/complete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Не вдалося завершити вхід');
          location.replace('/');
        } catch (error) {
          title.textContent = 'Потрібен робочий простір';
          message.textContent = error.message + '. Зверніться до адміністратора або створіть робочий простір у Stytch.';
          message.classList.add('error');
          loader.remove();
        }
      })();
    </script>
  </body>
</html>
